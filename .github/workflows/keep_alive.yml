name: Manter Streamlit Ativo

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Playwright e Chromium
        run: |
          pip install playwright
          playwright install chromium

      - name: Acessar aplicativo Streamlit
        run: |
          python -c "
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto('https://streamlit.app', timeout=60000)
              page.wait_for_timeout(15000)
              
              wakeup_btn = page.locator('button:has-text(\"Yes, get this app back up!\")')
              if wakeup_btn.count() > 0:
                  wakeup_btn.click()
                  page.wait_for_timeout(20000)
                  
              browser.close()
          "
